name: Bug report
description: Сообщить о проблеме в Block Notification
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: details
    attributes:
      label: Что произошло?
      description: Опишите ожидаемый и фактический результат. Не добавляйте личные данные.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Версия Chrome
